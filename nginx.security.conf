# Include inside Volt's HTTPS server block. Add the operator VPN and Kernel host IPs.
allow 127.0.0.1;
allow ::1;
deny all;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
location ~ (^|/)\. { return 404; }
location ~* \.(env|ini|log|sql|bak|backup|old|swp|map)$ { return 404; }
location = /api/v1/internal/updater/restore { return 404; }
location ^~ /api/v1/internal/neptune/ { return 404; }
