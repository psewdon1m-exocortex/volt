# Include inside Volt's public HTTPS server block. The locked/login page and
# authenticated UI/API are intentionally reachable from every client IP.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
location ~ (^|/)\. { return 404; }
location ~* \.(env|ini|log|sql|bak|backup|old|swp|map)$ { return 404; }
location = /api/v1/internal/updater/restore { return 404; }
location ^~ /api/v1/internal/neptune/ { return 404; }
