name: Volt CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: volt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Tests, typecheck, build and dependency audit
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high && npm run check
      - name: Syntax and release contract checks
        shell: bash
        run: |
          set -euo pipefail
          find server scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          sh -n install.sh
          sh -n scripts/bootstrap.sh
          bash -n scripts/build-release.sh
          rm -rf release-artifacts-ci
          updater_bundle="$RUNNER_TEMP/volt-ci-updater/updater"
          mkdir -p "$updater_bundle/systemd" "$updater_bundle/release-trust"
          install -m 0755 /dev/null "$updater_bundle/install.sh"
          install -m 0755 /dev/null "$updater_bundle/updater-linux-amd64"
          install -m 0644 /dev/null "$updater_bundle/systemd/updater.service"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/volt-ci-updater-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/volt-ci-updater-private.pem" -pubout \
            -out "$updater_bundle/release-trust/updater.pem"
          rm -f "$RUNNER_TEMP/volt-ci-updater-private.pem"
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          repository="$GITHUB_REPOSITORY"
          GITHUB_REPOSITORY="$repository" \
            IMAGE_REFERENCE="ghcr.io/${repository,,}" \
            IMAGE_DIGEST="sha256:$(printf 'a%.0s' {1..64})" \
            UPDATER_BUNDLE_DIR="$updater_bundle" \
            UPDATER_BUNDLE_VERSION="$updater_version" \
            bash scripts/build-release.sh 0.0.0-ci release-artifacts-ci
          node scripts/verify-release.mjs release-artifacts-ci/volt-release.json
          (cd release-artifacts-ci && sha256sum -c volt-0.0.0-ci-compose.tar.gz.sha256)
      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .ci.env
          sed -i \
            -e 's|^KERNEL_URL=.*|KERNEL_URL=https://kernel.example.test|' \
            -e 's|^KERNEL_SERVICE_TOKEN=.*|KERNEL_SERVICE_TOKEN=ci-kernel-service-token|' \
            -e 's|^VOLT_ACCESS_KEY=.*|VOLT_ACCESS_KEY=ci-access-key-strong|' \
            -e 's|^VOLT_IMAGE=.*|VOLT_IMAGE=ghcr.io/example/volt@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa|' \
            -e 's|^VOLT_SECRETS_GID=.*|VOLT_SECRETS_GID=1000|' \
            -e 's|^NEPTUNE_SOCKET_GID=.*|NEPTUNE_SOCKET_GID=1001|' \
            -e 's|^UPDATER_SOCKET_GID=.*|UPDATER_SOCKET_GID=1002|' \
            -e 's|^UPDATER_CONTROL_TOKEN=.*|UPDATER_CONTROL_TOKEN=ci-updater-control-token-32-characters|' \
            .ci.env
          docker compose --env-file .ci.env -f compose.production.yaml config --quiet
          ! docker compose --env-file .ci.env -f compose.production.yaml config | grep -q 'CHANGE_ME'
      - name: Build exact container candidate
        run: docker build --tag exocortex-volt-ci:${{ github.sha }} .
      - name: Container health smoke test
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          trap 'docker rm -f volt-ci-smoke >/dev/null 2>&1 || true; rm -rf "$secret_dir"' EXIT
          printf '%s\n' 'volt-ci-access-key-only' > "$secret_dir/access.key"
          chmod 0755 "$secret_dir"
          chmod 0444 "$secret_dir/access.key"
          docker run -d --name volt-ci-smoke \
            -e VOLT_LISTEN_HOST=0.0.0.0 \
            -e VOLT_ACCESS_KEY_FILE=/run/secrets/access.key \
            -v "$secret_dir:/run/secrets:ro" \
            exocortex-volt-ci:${{ github.sha }}
          for _ in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' volt-ci-smoke)"
            [[ "$status" == healthy ]] && exit 0
            [[ "$status" == unhealthy ]] && docker logs volt-ci-smoke && exit 1
            sleep 2
          done
          docker logs volt-ci-smoke
          exit 1

  pre-push-gate:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate seven mandatory areas
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/pre-push-gate.py --upstream-result "${{ needs.verify.result }}" --report .pre-push-gate-report.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: volt-pre-push-gate-${{ github.sha }}
          path: .pre-push-gate-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
