name: Release Volt

on:
  push:
    tags:
      - "volt-v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  UPDATER_REPOSITORY: ${{ vars.UPDATER_REPOSITORY || 'psewdon1m-exocortex/updater' }}

concurrency:
  group: volt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#volt-v}"
          [[ "$GITHUB_REF_NAME" == "volt-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$(node -p "require('./package.json').version")" == "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Test release source
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run check

      - name: Download and verify pinned Updater
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          mkdir -p .release-inputs
          gh release download "updater-v${updater_version}" \
            --repo "$UPDATER_REPOSITORY" --dir .release-inputs \
            --pattern "updater-${updater_version}-install.tar.gz" \
            --pattern "updater-${updater_version}-install.tar.gz.sha256"
          (cd .release-inputs && sha256sum -c "updater-${updater_version}-install.tar.gz.sha256")
          tar -xzf ".release-inputs/updater-${updater_version}-install.tar.gz" -C .release-inputs

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate once
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Smoke-test the exact published digest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          name="volt-release-${GITHUB_RUN_ID}"
          volume="volt-release-${GITHUB_RUN_ID}"
          secret_dir="$(mktemp -d)"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true; rm -rf "$secret_dir"' EXIT
          printf '%s\n' 'volt-release-access-key' > "$secret_dir/access.key"
          chmod 0755 "$secret_dir"
          chmod 0444 "$secret_dir/access.key"
          docker pull "$IMAGE"
          docker volume create "$volume" >/dev/null
          docker run -d --name "$name" --read-only --init --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --mount "type=volume,source=$volume,target=/app/data" \
            -v "$secret_dir/access.key:/run/secrets/volt-access-key:ro" \
            -p 127.0.0.1::18184 \
            -e VOLT_LISTEN_HOST=0.0.0.0 \
            -e VOLT_ACCESS_KEY_FILE=/run/secrets/volt-access-key "$IMAGE"
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "18184/tcp") 0).HostPort}}' "$name")
          for _ in {1..45}; do
            curl -fsS --max-time 2 "http://127.0.0.1:$port/api/v1/health" >/dev/null && exit 0
            if [ "$(docker inspect --format '{{.State.Status}}' "$name")" = exited ]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          docker logs "$name"
          exit 1

      - name: Build and verify release artifacts
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          UPDATER_BUNDLE_DIR="$PWD/.release-inputs/updater" \
          UPDATER_BUNDLE_VERSION="$updater_version" \
            bash scripts/build-release.sh "${{ steps.release.outputs.version }}"
          node scripts/verify-release.mjs release-artifacts/volt-release.json
          (cd release-artifacts && sha256sum -c "volt-${{ steps.release.outputs.version }}-compose.tar.gz.sha256")

      - name: Promote the tested digest
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" >/dev/null 2>&1; then
            echo "Volt version tag already exists; refusing replacement" >&2
            exit 1
          fi
          source="${{ steps.release.outputs.image }}@${{ steps.candidate.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.image }}:latest" "$source"
          promoted=$(docker buildx imagetools inspect \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          test "$promoted" = "${{ steps.candidate.outputs.digest }}"

      - name: Sign trusted release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs release-artifacts/volt-release.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "release-artifacts/*"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --latest=false --generate-notes \
            --title "Volt ${{ steps.release.outputs.version }}"
